name: MLOps CI/CD Pipeline (GCP)

on:
  push:
    branches: [ main, develop ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

env:
  PYTHON_VERSION: '3.11'
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GCP_REGION: us-central1
  GAR_LOCATION: us-central1
  REPOSITORY: fraud-detection
  SERVICE_NAME: fraud-api
  PYTHONPATH: ${{ github.workspace }}  # ← Add this!

jobs:

  code-quality:
      name: Code Quality Checks
      runs-on: ubuntu-latest
      
      steps:
        - name: Checkout code
          uses: actions/checkout@v4
        
        - name: Set up Python
          uses: actions/setup-python@v5
          with:
            python-version: ${{ env.PYTHON_VERSION }}
            cache: 'pip'
        
        - name: Install linting tools
          run: |
            pip install black pylint flake8
        
        - name: Run Black (auto-fix formatting)
          run: |
            black src/ tests/
          continue-on-error: true
        
        - name: Run Pylint
          run: |
            pylint src/ --fail-under=6.0
          continue-on-error: true
        
        - name: Run Flake8
          run: |
            flake8 src/ tests/ --max-line-length=127 \
              --extend-ignore=E203,W503,E722,F401,F541,W293,W292,E402
          continue-on-error: true

  test:
      name: Run Tests
      runs-on: ubuntu-latest
      needs: code-quality
      
      steps:
        - name: Checkout code
          uses: actions/checkout@v4
        
        - name: Set up Python
          uses: actions/setup-python@v5
          with:
            python-version: ${{ env.PYTHON_VERSION }}
            cache: 'pip'
        
        - name: Install dependencies
          run: |
            pip install -r requirements.txt
            pip install pytest pytest-cov
        
        - name: Create directories
          run: |
            mkdir -p data/raw data/processed models monitoring/metrics monitoring/reports
        
        - name: Generate test data
          run: |
            python src/data/generate_transactions.py
        
        - name: Engineer features
          run: |
            python src/features/feature_engineering.py
        
        - name: Train model
          run: |
            python src/models/train.py
        
        - name: Run tests with coverage
          run: |
            pytest tests/ -v --cov=src --cov-report=xml --cov-report=term

  build-and-push:
    name: Build & Push to GAR
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name != 'pull_request'
    
    permissions:
      contents: read
      id-token: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
      
      - name: Configure Docker for GAR
        run: |
          gcloud auth configure-docker ${{ env.GAR_LOCATION }}-docker.pkg.dev
      
      - name: Build Docker image
        run: |
          docker build -t ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/fraud-api:${{ github.sha }} .
          docker tag ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/fraud-api:${{ github.sha }} \
                     ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/fraud-api:latest
      
      - name: Push to Artifact Registry
        run: |
          docker push ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/fraud-api:${{ github.sha }}
          docker push ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/fraud-api:latest

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/develop'
    environment: staging
    
    permissions:
      contents: read
      id-token: write
    
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy fraud-api-staging \
            --image=${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/fraud-api:${{ github.sha }} \
            --platform=managed \
            --region=${{ env.GCP_REGION }} \
            --allow-unauthenticated \
            --memory=2Gi \
            --cpu=2 \
            --set-env-vars="ENVIRONMENT=staging"
      
      - name: Get URL
        run: |
          gcloud run services describe fraud-api-staging --platform=managed --region=${{ env.GCP_REGION }} --format='value(status.url)'

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build-and-push
    if: startsWith(github.ref, 'refs/tags/v')
    environment: production
    
    permissions:
      contents: read
      id-token: write
    
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy fraud-api-prod \
            --image=${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/fraud-api:${{ github.sha }} \
            --platform=managed \
            --region=${{ env.GCP_REGION }} \
            --allow-unauthenticated \
            --memory=4Gi \
            --cpu=2 \
            --set-env-vars="ENVIRONMENT=production"
      
      - name: Get URL
        run: |
          gcloud run services describe fraud-api-prod --platform=managed --region=${{ env.GCP_REGION }} --format='value(status.url)'