name: MLOps CI/CD Pipeline (GCP)

on:
  push:
    branches: [ main, develop ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

env:
  PYTHON_VERSION: '3.11'
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GCP_REGION: us-central1
  GAR_LOCATION: us-central1
  REPOSITORY: fraud-detection
  SERVICE_NAME: fraud-api

jobs:
  # Stage 1: Code Quality
  code-quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      
      - name: Install linting tools
        run: |
          pip install black pylint flake8
      
      - name: Run Black (code formatting)
        run: |
          black --check src/ tests/
        continue-on-error: true
      
      - name: Run Pylint (code quality)
        run: |
          pylint src/ --fail-under=8.0 --disable=C0114,C0115,C0116
        continue-on-error: true
      
      - name: Run Flake8 (style guide)
        run: |
          flake8 src/ tests/ --max-line-length=127 --extend-ignore=E203,W503

  # Stage 2: Tests
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: code-quality
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-cov
      
      - name: Create necessary directories
        run: |
          mkdir -p data/raw data/processed models monitoring/metrics monitoring/reports
      
      - name: Generate test data
        run: |
          python src/data/generate_data.py
      
      - name: Engineer features
        run: |
          python src/data/feature_engineering.py
      
      - name: Train model
        run: |
          python src/models/train.py
      
      - name: Run tests with coverage
        run: |
          pytest tests/ -v --cov=src --cov-report=xml --cov-report=term
      
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  # Stage 3: Build and Push to Google Artifact Registry
  build-and-push:
    name: Build & Push to GAR
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name != 'pull_request'
    
    permissions:
      contents: read
      id-token: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
      
      - name: Configure Docker for GAR
        run: |
          gcloud auth configure-docker ${{ env.GAR_LOCATION }}-docker.pkg.dev
      
      - name: Build Docker image
        run: |
          docker build -t ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/fraud-api:${{ github.sha }} .
          docker tag ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/fraud-api:${{ github.sha }} \
                     ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/fraud-api:latest
      
      - name: Push to Artifact Registry
        run: |
          docker push ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/fraud-api:${{ github.sha }}
          docker push ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/fraud-api:latest

  # Stage 4: Security Scan
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name != 'pull_request'
    
    permissions:
      contents: read
      id-token: write
    
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
      
      - name: Scan for vulnerabilities
        run: |
          gcloud artifacts docker images scan ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/fraud-api:${{ github.sha }}

  # Stage 5a: Deploy to Cloud Run (Staging)
  deploy-staging:
    name: Deploy to Cloud Run (Staging)
    runs-on: ubuntu-latest
    needs: [build-and-push, security]
    if: github.ref == 'refs/heads/develop'
    environment:
      name: staging
      url: https://fraud-api-staging-${{ secrets.GCP_PROJECT_ID }}.run.app
    
    permissions:
      contents: read
      id-token: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy fraud-api-staging \
            --image=${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/fraud-api:${{ github.sha }} \
            --platform=managed \
            --region=${{ env.GCP_REGION }} \
            --allow-unauthenticated \
            --memory=2Gi \
            --cpu=2 \
            --max-instances=10 \
            --set-env-vars="ENVIRONMENT=staging"
      
      - name: Get service URL
        run: |
          gcloud run services describe fraud-api-staging \
            --platform=managed \
            --region=${{ env.GCP_REGION }} \
            --format='value(status.url)'

  # Stage 5b: Deploy to Cloud Run (Production)
  deploy-production:
    name: Deploy to Cloud Run (Production)
    runs-on: ubuntu-latest
    needs: [build-and-push, security]
    if: startsWith(github.ref, 'refs/tags/v')
    environment:
      name: production
      url: https://fraud-api-${{ secrets.GCP_PROJECT_ID }}.run.app
    
    permissions:
      contents: read
      id-token: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy fraud-api-prod \
            --image=${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/fraud-api:${{ github.sha }} \
            --platform=managed \
            --region=${{ env.GCP_REGION }} \
            --allow-unauthenticated \
            --memory=4Gi \
            --cpu=2 \
            --max-instances=100 \
            --set-env-vars="ENVIRONMENT=production"
      
      - name: Get service URL
        run: |
          SERVICE_URL=$(gcloud run services describe fraud-api-prod \
            --platform=managed \
            --region=${{ env.GCP_REGION }} \
            --format='value(status.url)')
          echo "🚀 Production URL: $SERVICE_URL"